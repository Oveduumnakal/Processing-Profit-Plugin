plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.oveduumnakal.processingprofit.ProcessingProfitPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.oveduumnakal'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
	options.compilerArgs << '-Xlint:deprecation'
}

def pythonExecutable = org.gradle.internal.os.OperatingSystem.current().isWindows()
		? 'python'
		: 'python3'

tasks.register('checkStyleRules', Exec) {
	group = 'verification'
	description = 'Checks the project coding standards (scripts/check-style.py).'
	commandLine pythonExecutable, 'scripts/check-style.py'
}

check.dependsOn checkStyleRules

tasks.register('validateDataSnapshots') {
	group = 'verification'
	description = 'Fails the build if any bundled data snapshot is missing, empty, or malformed.'
	def resources = file('src/main/resources')
	def snapshots = [
			'recipes.json', 'success_params.json',
			'success_modifiers.json', 'failure_outputs.json',
	]
	inputs.files(snapshots.collect { new File(resources, it) })
	doLast {
		def slurper = new groovy.json.JsonSlurper()
		snapshots.each { name ->
			def f = new File(resources, name)
			if (!f.exists() || f.length() == 0) {
				throw new GradleException("Data snapshot ${name} is missing or empty.")
			}
			def data
			try {
				data = slurper.parse(f)
			} catch (Exception e) {
				throw new GradleException("Data snapshot ${name} is not valid JSON: ${e.message}")
			}
			if (data instanceof List && data.isEmpty()) {
				throw new GradleException("Data snapshot ${name} is an empty array.")
			}
			if (data instanceof Map && data.isEmpty()) {
				throw new GradleException("Data snapshot ${name} is an empty object.")
			}
		}
		def recipes = slurper.parse(new File(resources, 'recipes.json'))
		if (!recipes.any { it.outputs && it.outputs[0]?.itemId != null }) {
			throw new GradleException("recipes.json has no recipe with a resolved output item id.")
		}
		def modifiers = slurper.parse(new File(resources, 'success_modifiers.json'))
		def shapes = ['ADD_CHANCE', 'STOP_LEVEL', 'FORCE_SUCCESS', 'YIELD_MULT']
		modifiers.each { m ->
			if (!(m.effect in shapes)) {
				throw new GradleException("success_modifiers.json entry '${m.id}' has bad effect '${m.effect}'.")
			}
		}
		logger.lifecycle("Data snapshots OK: ${recipes.size()} recipes, ${modifiers.size()} modifiers.")
	}
}

check.dependsOn validateDataSnapshots

javadoc {
	options.memberLevel = JavadocMemberLevel.PRIVATE
	options.addStringOption('Xdoclint:syntax,html,reference', '-quiet')
}

check.dependsOn javadoc

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
